AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  wellmark.tvlss.com - TVLSS demonstration site for health-plan chatbot agents.
  Static site on S3 + CloudFront; /api/* goes to a streaming Lambda Function URL
  that runs tool-using agents on Amazon Bedrock. Deploys to us-east-2; the ACM
  certificate must be in us-east-1 (CloudFront constraint).

Parameters:
  DomainName:
    Type: String
    Default: wellmark.tvlss.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone id for the domain (set in .env, see deploy.sh)
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:aws:acm:us-east-1:.*"
    ConstraintDescription: CloudFront certificates must live in us-east-1.
    Description: ACM certificate covering DomainName. Must be in us-east-1 (set in .env, see deploy.sh)
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
    Description: Bedrock model or inference profile id available in this region.
  MaxOutputTokens:
    Type: String
    Default: "1200"
  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: Caps simultaneous chats, which caps Bedrock spend.
  Backend:
    Type: String
    Default: typescript
    AllowedValues: [typescript, python]
    Description: Which chat Lambda CloudFront routes /api/* to. Both are deployed; both cost nothing idle.

Conditions:
  UsePython: !Equals [!Ref Backend, python]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: false
        EntryPoints:
          - src/handler.ts
        External:
          - "@aws-sdk/*"
    Properties:
      CodeUri: api/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 90
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"

  ChatFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ChatFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM

  # CloudFront's OAC needs InvokeFunction as well as InvokeFunctionUrl (AWS docs, 2026).
  # With only InvokeFunctionUrl the function URL answers 403 to every signed request.
  ChatFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Python twin of ChatFunction. Same routes and wire protocol; buffered rather than
  # streamed because the managed Python runtime cannot stream a Function URL response.
  ChatFunctionPy:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: api-python/
      Handler: handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 90
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: BUFFERED
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"

  ChatFunctionPyUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ChatFunctionPy
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM

  ChatFunctionPyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunctionPy
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ChatFunctionPyLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatFunctionPy}"
      RetentionInDays: 30

  ChatFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatFunction}"
      RetentionInDays: 30

  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-lambda-oac"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map /claims to /claims.html and directory paths to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.indexOf('/api/') === 0) { return request; }
          if (uri.endsWith('/')) { request.uri = uri + 'index.html'; return request; }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) { request.uri = uri + '.html'; }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !If
              - UsePython
              - !Select [2, !Split ["/", !GetAtt ChatFunctionPyUrl.FunctionUrl]]
              - !Select [2, !Split ["/", !GetAtt ChatFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03   # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed hosted zone id
        EvaluateTargetHealth: false

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Value: !Sub "https://${DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ChatFunctionName:
    Value: !Ref ChatFunction
  ChatFunctionUrl:
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  ChatFunctionPyName:
    Value: !Ref ChatFunctionPy
  ActiveBackend:
    Value: !Ref Backend
