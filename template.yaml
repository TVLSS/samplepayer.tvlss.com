AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  samplepayer.tvlss.com - TVLSS demonstration site for health-plan chatbot agents.
  Static site on S3 + CloudFront; /api/* goes to a streaming Lambda Function URL
  that runs tool-using agents on Amazon Bedrock. Deploys to us-east-2; the ACM
  certificate must be in us-east-1 (CloudFront constraint).

Parameters:
  DomainName:
    Type: String
    Default: samplepayer.tvlss.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone id for the domain (set in .env, see deploy.sh)
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:aws:acm:us-east-1:.*"
    ConstraintDescription: CloudFront certificates must live in us-east-1.
    Description: ACM certificate covering DomainName. Must be in us-east-1 (set in .env, see deploy.sh)
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
    Description: Bedrock model or inference profile id available in this region.
  MaxOutputTokens:
    Type: String
    Default: "1200"
  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: Caps simultaneous chats, which caps Bedrock spend.
  DailyBudgetUsd:
    Type: Number
    Default: 5
    Description: Cap on estimated MODEL spend per UTC day, reserved in the Lambda before every model call. Not the AWS bill; the DailyBudget resource watches that.
  PriceInPerMtok:
    Type: Number
    Default: 3
    Description: Assumed input price, USD per million tokens. Set above list price so the cap errs early.
  PriceOutPerMtok:
    Type: Number
    Default: 15
    Description: Assumed output price, USD per million tokens.
  IpTurnsPerHour:
    Type: Number
    Default: 40
    Description: Per-visitor fairness limit so one script cannot spend the whole day's budget.
  NotificationEmail:
    Type: String
    Default: ""
    Description: Where budget and traffic alerts go. Empty disables the alerts.
  Backend:
    Type: String
    Default: typescript
    AllowedValues: [typescript, python]
    Description: Which chat Lambda CloudFront routes /api/* to. Both are deployed; both cost nothing idle.

Conditions:
  UsePython: !Equals [!Ref Backend, python]
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  # Bedrock Guardrail applied to every model call in both Lambdas. Input: only the
  # visitor's latest message is assessed (the runtime wraps it in guardContent, so
  # tool results are not). Output: assessed in async streaming mode so text still
  # streams. DRAFT is the working version, so a template change takes effect on
  # deploy without a new GuardrailVersion resource; pin a numbered version for a
  # real product.
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${AWS::StackName}-guardrail"
      Description: Denies medical advice, common abuse categories and prompt attacks; masks financial and government identifiers.
      BlockedInputMessaging: "I can't help with that here. If it's about symptoms or treatment, please call the 24/7 nurse line at 1-800-555-0142, or 911 in an emergency. I can help with coverage, claims and your plan."
      BlockedOutputsMessaging: "I can't help with that here. If it's about symptoms or treatment, please call the 24/7 nurse line at 1-800-555-0142, or 911 in an emergency. I can help with coverage, claims and your plan."
      TopicPolicyConfig:
        TopicsConfig:
          - Name: MedicalAdvice
            Type: DENY
            Definition: Diagnosing conditions, assessing symptoms, or advising for or against a treatment, drug, dose or procedure for a person's health. Asking whether care is covered is not this topic.
            Examples:
              - "I've had chest pain for three days, what should I take for it?"
              - "Is 800mg of ibuprofen safe with my blood pressure medication?"
              - "Do these symptoms sound like strep throat?"
              - "Should I get the MRI or just try rest first?"
              - "Which is better for my back, physical therapy or a steroid injection?"
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: HATE, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: INSULTS, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: VIOLENCE, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: MISCONDUCT, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }
      SensitiveInformationPolicyConfig:
        # Only identifiers that never legitimately appear in a health-plan answer.
        # Names, addresses, phones and emails are the demo's own synthetic data.
        PiiEntitiesConfig:
          - { Type: US_SOCIAL_SECURITY_NUMBER, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_CVV, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_EXPIRY, Action: ANONYMIZE }
          - { Type: US_BANK_ACCOUNT_NUMBER, Action: ANONYMIZE }
          - { Type: US_BANK_ROUTING_NUMBER, Action: ANONYMIZE }
          - { Type: INTERNATIONAL_BANK_ACCOUNT_NUMBER, Action: ANONYMIZE }
          - { Type: US_PASSPORT_NUMBER, Action: ANONYMIZE }
          - { Type: DRIVER_ID, Action: ANONYMIZE }
          - { Type: PASSWORD, Action: ANONYMIZE }
          - { Type: PIN, Action: ANONYMIZE }
          - { Type: AWS_ACCESS_KEY, Action: ANONYMIZE }
          - { Type: AWS_SECRET_KEY, Action: ANONYMIZE }

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: false
        EntryPoints:
          - src/handler.ts
        External:
          - "@aws-sdk/*"
    Properties:
      CodeUri: api/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 90
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
          USAGE_TABLE: !Ref UsageTable
          DAILY_BUDGET_USD: !Ref DailyBudgetUsd
          PRICE_IN_PER_MTOK: !Ref PriceInPerMtok
          PRICE_OUT_PER_MTOK: !Ref PriceOutPerMtok
          IP_TURNS_PER_HOUR: !Ref IpTurnsPerHour
          GUARDRAIL_ID: !GetAtt Guardrail.GuardrailId
          GUARDRAIL_VERSION: DRAFT
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !GetAtt Guardrail.GuardrailArn
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:GetItem]
              Resource: !GetAtt UsageTable.Arn

  ChatFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ChatFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM

  # CloudFront's OAC needs InvokeFunction as well as InvokeFunctionUrl (AWS docs, 2026).
  # With only InvokeFunctionUrl the function URL answers 403 to every signed request.
  ChatFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Python twin of ChatFunction. Same routes and wire protocol; buffered rather than
  # streamed because the managed Python runtime cannot stream a Function URL response.
  ChatFunctionPy:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: api-python/
      Handler: handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 90
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
          USAGE_TABLE: !Ref UsageTable
          DAILY_BUDGET_USD: !Ref DailyBudgetUsd
          PRICE_IN_PER_MTOK: !Ref PriceInPerMtok
          PRICE_OUT_PER_MTOK: !Ref PriceOutPerMtok
          IP_TURNS_PER_HOUR: !Ref IpTurnsPerHour
          GUARDRAIL_ID: !GetAtt Guardrail.GuardrailId
          GUARDRAIL_VERSION: DRAFT
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: BUFFERED
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !GetAtt Guardrail.GuardrailArn
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:GetItem]
              Resource: !GetAtt UsageTable.Arn

  ChatFunctionPyUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ChatFunctionPy
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM

  ChatFunctionPyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunctionPy
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ChatFunctionPyLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatFunctionPy}"
      RetentionInDays: 30

  # One item per UTC day holds estimated spend; per-visitor hourly counters expire via TTL.
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasEmail
    Properties:
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: email

  # Second line of defence: independent of the in-Lambda counter.
  TrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasEmail
    Properties:
      AlarmDescription: More than 150 chat invocations in an hour on samplepayer.tvlss.com
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref ChatFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 150
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasEmail
    Properties:
      AlarmDescription: Chat Lambda errors on samplepayer.tvlss.com
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ChatFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Billing-side backstop. Cost data lags up to a day, so the Lambda cap is the real limit.
  DailyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-daily"
        BudgetType: COST
        TimeUnit: DAILY
        BudgetLimit: { Amount: !Ref DailyBudgetUsd, Unit: USD }
        CostFilters:
          TagKeyValue: [!Sub "aws:cloudformation:stack-name$${AWS::StackName}"]
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref NotificationEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref NotificationEmail }]

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Preload: false, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=(), payment=()", Override: true }

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-logs-${AWS::AccountId}"
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules: [{ Id: expire, Status: Enabled, ExpirationInDays: 30 }]

  ChatFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatFunction}"
      RetentionInDays: 30

  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-lambda-oac"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map /claims to /claims.html and directory paths to index.html; stamp the viewer IP on /api/*
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.indexOf('/api/') === 0) {
            // The per-visitor rate limit keys on this. event.viewer.ip is what CloudFront
            // saw on the TLS connection; setting it here overwrites anything the client sent.
            request.headers['x-viewer-ip'] = { value: event.viewer.ip };
            return request;
          }
          if (uri.endsWith('/')) { request.uri = uri + 'index.html'; return request; }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) { request.uri = uri + '.html'; }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !If
              - UsePython
              - !Select [2, !Split ["/", !GetAtt ChatFunctionPyUrl.FunctionUrl]]
              - !Select [2, !Split ["/", !GetAtt ChatFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed hosted zone id
        EvaluateTargetHealth: false

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Value: !Sub "https://${DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ChatFunctionName:
    Value: !Ref ChatFunction
  ChatFunctionUrl:
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  ChatFunctionPyName:
    Value: !Ref ChatFunctionPy
  ActiveBackend:
    Value: !Ref Backend
  UsageTableName:
    Value: !Ref UsageTable
  GuardrailId:
    Value: !GetAtt Guardrail.GuardrailId
